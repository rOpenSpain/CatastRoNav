url: https://ropenspain.github.io/CatastRoNav

repo:
  branch: main

template:
  bootstrap: 5
  package: rostemplate

figures:
  dpi: 300
  fig.retina: 2

home:
  title: CatastRoNav
  description: >
    Access complete municipal datasets, bounding box features and georeferenced
    map images from the Cadastre of Navarre.

authors:
  Diego Hernangómez:
    href: https://dieghernan.github.io/
  Francisco J. Goerlich:
    href: https://www.uv.es/goerlich/

reference:
- title: Find municipalities
  desc: >
    Search by municipality name or cadastral code before downloading data.
- contents:
  - has_concept("search")

- title: Download municipal datasets
  desc: >
    Use the ATOM service to retrieve complete municipal datasets for addresses,
    buildings and cadastral parcels.
- subtitle: Explore download URLs
  desc: >
    List available municipalities, download URLs and data reference dates.
- contents:
  - ends_with("_db_all")
- subtitle: Download spatial features
  desc: >
    Download all features of a selected type for one municipality as an
    **sf** object.
- contents:
  - has_concept("atom")
  - -has_concept("search")
  - -ends_with("_db_all")

- title: Query features within a bounding box
  desc: >
    Use the WFS service to retrieve addresses, buildings or cadastral parcels
    for a selected area as an **sf** object.
- contents:
  - has_concept("wfs")

- title: Download map images
  desc: >
    Use the WMS service to download georeferenced cadastral map images as a
    **terra** SpatRaster object.
- contents:
  - has_concept("wms")

- title: Manage the cache
  desc: >
    Configure, inspect and clear the local cache used by **CatastRoNav**.
- contents:
  - has_concept("cache_utilities")

- title: Package overview
  desc: >
    Read the package overview and follow links to the main workflows.
- contents:
  - CatastRoNav-package

articles:
- title: Get started
  desc: >
    Combine cadastral map layers around El Sadar Stadium and create a thematic
    map of building construction periods in Pamplona.
  contents:
  - CatastRoNav
